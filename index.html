main{display:grid;gap:12px;margin-top:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:background .22s,border-color .22s}.card-pad{padding:15px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}.section-head h2{margin:0;font-size:17px;letter-spacing:-.02em}.section-head p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.5}

.data-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}.small-btn{border:1px solid var(--line);background:var(--card-soft);color:var(--muted);border-radius:10px;padding:7px 9px;font-size:10px;font-weight:750;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:10px;line-height:1.6;padding:3px 10px 0}
.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:100;background:rgba(5,18,34,.52);display:grid;place-items:center;padding:14px}.modal-card{width:min(100%,450px);max-height:min(88vh,720px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 22px 60px rgba(0,0,0,.3);padding:16px}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}.modal-head h2{margin:0;font-size:18px}.modal-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.close-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--card-soft);color:var(--muted);font-size:19px;line-height:1;cursor:pointer}
.select-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:5px;margin-top:10px}.field label,.select-row label{font-size:11px;font-weight:800;color:var(--muted)}.field input,.field textarea,.select-row select{width:100%;border:1px solid var(--line);background:var(--card-soft);color:var(--ink);border-radius:11px;padding:10px;outline:none}.field input:focus,.field textarea:focus,.select-row select:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}.field textarea{min-height:78px;resize:vertical}
.slot-preview{margin-top:12px;border:1px solid var(--blue-border);background:var(--blue-soft);color:var(--blue-text);border-radius:12px;padding:10px;font-size:12px;font-weight:800}.existing-course{margin-top:8px;border:1px solid var(--yellow-border);background:var(--yellow-soft);color:var(--yellow-text);border-radius:12px;padding:10px;font-size:11px;line-height:1.5}.existing-course strong{display:block;font-size:12px;margin-bottom:2px}.modal-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}.modal-actions:has(.danger:not([hidden])){grid-template-columns:auto 1fr 1fr}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card-soft);font-weight:850;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}html[data-theme="dark"] .btn.primary{color:#062033}.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line));background:transparent}.btn[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--ink);color:var(--card);border-radius:999px;padding:9px 14px;font-size:12px;z-index:120;transition:.2s;max-width:calc(100vw - 28px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:390px){.app{padding-left:8px;padding-right:8px}.sticky{margin-left:-8px;margin-right:-8px;padding-left:8px;padding-right:8px}.card-pad{padding:12px}.week-grid{grid-template-columns:35px repeat(7,minmax(0,1fr));gap:3px;padding:4px}.slot{min-height:62px;padding:4px 1px}.row-label{min-height:62px;font-size:9px}.row-label small{font-size:6px}.grid-head{font-size:9px}.slot-mark{font-size:12px}.slot-sub{font-size:6px}}

<body>
<div class="app">
  <header class="hero">
    <div>
      <h1>2026级设计专业<br>研究生课表</h1>
      <p>第1周周一：2026年9月7日 · 共17周 · 点格子可编辑</p>
    </div>
    <div class="hero-actions">
      <button class="icon-btn" id="themeBtn" type="button" aria-pressed="false"><span id="themeIcon">☾</span> <span id="themeText">夜晚</span></button>
      <button class="add-btn" id="addPlanBtn" type="button">＋ 添加安排</button>
    </div>
  </header>

  <nav class="sticky" aria-label="周次选择">
    <div class="week-tabs" id="weekTabs"></div>
    <div class="week-toolbar">
      <button class="side" id="prevWeek" type="button" aria-label="上一周">‹</button>
      <div class="center">
        <strong id="weekTitle">第 1 周</strong>
        <span id="weekRange"></span>
        <button class="today-btn" id="todayBtn" type="button">回到本周</button>
      </div>
      <button class="side" id="nextWeek" type="button" aria-label="下一周">›</button>
    </div>
  </nav>

  <main>
    <section class="card card-pad">
      <div class="section-head">
        <div><h2>空闲总览</h2><p>浅蓝格子为空闲；点蓝色格子可直接添加个人安排。</p></div>
        <div class="legend" aria-label="图例"><span><i class="dot free"></i>空闲</span><span><i class="dot busy"></i>有课/安排</span></div>
      </div>
      <div class="summary">
        <div class="summary-top"><strong id="summaryTitle">本周空档</strong><span class="free-count" id="freeCount"></span></div>
        <div class="summary-note" id="summaryNote"></div>
        <div class="free-list" id="freeList"></div>
      </div>
    </section>

    <section class="card card-pad">
      <div class="section-head"><div><h2>一周时段表</h2><p>横轴为周一至周日，纵轴为上午、下午、晚上。</p></div></div>
      <div class="grid-wrap"><div class="week-grid" id="weekGrid"></div></div>
    </section>

    <section class="card card-pad">
      <div class="section-head"><div><h2>本周安排详情</h2><p id="courseCount"></p></div></div>
      <div class="detail-list" id="detailList"></div>
      <div class="data-actions">
        <button class="small-btn" id="exportBtn" type="button">导出我的安排</button>
        <label class="small-btn">导入安排<input id="importInput" type="file" accept=".json,application/json" hidden></label>
        <span class="small-btn" style="cursor:default">个人安排自动保存在本机</span>
      </div>
    </section>
  </main>
  <p class="footer">时间以学校实际通知为准 · 可切换到夜晚模式 · 第一次打开后可添加到手机桌面</p>
</div>

<div class="modal" id="planModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><div><h2 id="modalTitle">添加个人安排</h2><p>可添加空闲时间安排，也可补充课程时段备注。</p></div><button class="close-btn" id="closePlanBtn" type="button" aria-label="关闭">×</button></div>
    <form id="planForm">
      <div class="select-row">
        <label>星期<select id="planDay"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></label>
        <label>时段<select id="planSlot"><option value="morning">上午 · 1-4节</option><option value="afternoon">下午 · 5-8节</option><option value="evening">晚上 · 9-10节</option></select></label>
      </div>
      <div class="slot-preview" id="slotPreview"></div>
      <div class="existing-course" id="existingCourse" hidden></div>
      <div class="field"><label for="planTitle">安排名称</label><input id="planTitle" type="text" maxlength="40" placeholder="例如：小组讨论 / 图书馆 / 兼职" required></div>
      <div class="field"><label for="planNote">备注（可选）</label><textarea id="planNote" maxlength="160" placeholder="地点、准备事项或其他说明"></textarea></div>
      <div class="modal-actions"><button class="btn danger" id="deletePlanBtn" type="button" hidden>删除</button><button class="btn" id="cancelPlanBtn" type="button">取消</button><button class="btn primary" type="submit">保存</button></div>
    </form>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const BASE_DATE = new Date(2026,8,7,0,0,0);
const TOTAL_WEEKS = 17;
const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
const DAY_NAMES = ['', '周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const SLOTS = [
  {key:'morning',label:'上午',periods:'1-4节'},
  {key:'afternoon',label:'下午',periods:'5-8节'},
  {key:'evening',label:'晚上',periods:'9-10节'}
];
const COURSE_TEMPLATES = [
  {day:1,slot:'afternoon',start:3,end:14,name:'AI短片创作',teacher:'陈晓伟',room:'304-1'},
  {day:1,slot:'evening',start:9,end:12,name:'艺术品设计',teacher:'王晓予',room:'304-1'},
  {day:2,slot:'morning',start:2,end:9,name:'设计史论',teacher:'张晨',room:'304-1'},
  {day:2,slot:'morning',start:10,end:16,name:'中原民间工艺与创意实践',teacher:'任涛',room:'304-1'},
  {day:2,slot:'afternoon',start:8,end:11,name:'设计方法',teacher:'张兴华',room:'设计第一工作室1-2'},
  {day:2,slot:'afternoon',start:13,end:16,name:'设计实践',teacher:'张兴华',room:'设计第一工作室1-2'},
  {day:2,slot:'evening',start:9,end:12,name:'艺术品设计',teacher:'王晓予',room:'304-1'},
  {day:3,slot:'morning',start:4,end:15,name:'中国传统家具研究与实践',teacher:'冯雨',room:'304-1'},
  {day:3,slot:'afternoon',start:11,end:14,name:'马克思主义与社会科学方法论',teacher:'曾孟',room:'北4102'},
  {day:3,slot:'evening',start:14,end:17,name:'策展与展示',teacher:'高云',room:'304-1'},
  {day:4,slot:'morning',start:10,end:16,name:'中原民间工艺与创意实践',teacher:'任涛',room:'304-1'},
  {day:4,slot:'afternoon',start:6,end:9,name:'信息资源检索',teacher:'马玉荣',room:'北1203'},
  {day:4,slot:'evening',start:14,end:17,name:'策展与展示',teacher:'高云',room:'304-1'},
  {day:5,slot:'morning',start:5,end:16,name:'健康教育与传播',teacher:'多位老师',room:'304-1'},
  {day:5,slot:'afternoon',start:8,end:11,name:'设计方法',teacher:'张兴华',room:'设计第一工作室1-2'},
  {day:5,slot:'afternoon',start:13,end:16,name:'设计实践',teacher:'张兴华',room:'设计第一工作室1-2'}
];
const HEALTH_TEACHERS = {5:'孙亮',6:'周子琛',7:'王鲜',8:'杨银梅',9:'周子琛',10:'王鲜',11:'王鲜',12:'叶贝珠',13:'孙亮',14:'孙亮',15:'孙亮',16:'孙亮'};
const PLAN_STORAGE_KEY = 'designSchedulePersonalPlansV1';
const THEME_STORAGE_KEY = 'designScheduleThemeV1';
let selectedWeek = getCurrentWeek();
let personalPlans = loadPersonalPlans();
let editingKey = null;
let toastTimer;

function getCurrentWeek(){
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.floor((today.getTime()-BASE_DATE.getTime())/WEEK_MS);
  return Math.max(1,Math.min(TOTAL_WEEKS,diff+1));
}
function mondayOfWeek(w){return new Date(BASE_DATE.getTime()+(w-1)*WEEK_MS)}
function sundayOfWeek(w){return new Date(mondayOfWeek(w).getTime()+6*86400000)}
function fmt(date){return (date.getMonth()+1)+'月'+date.getDate()+'日'}
function shortDate(date){return (date.getMonth()+1)+'/'+date.getDate()}
function slotInfo(key){return SLOTS.find(slot=>slot.key===key)}
function planKey(w,day,slot){return w+'|'+day+'|'+slot}
function coursesAt(w,day,slot){
  return COURSE_TEMPLATES.filter(c=>c.day===day&&c.slot===slot&&w>=c.start&&w<=c.end).map(c=>({...c,teacher:c.name==='健康教育与传播'?(HEALTH_TEACHERS[w]||'待定'):c.teacher,periodText:slotInfo(c.slot).periods}));
}
function getPersonalPlan(w,day,slot){return personalPlans[planKey(w,day,slot)]||null}
function isSlotFree(w,day,slot){return coursesAt(w,day,slot).length===0&&!getPersonalPlan(w,day,slot)}
function loadPersonalPlans(){
  try{const saved=JSON.parse(localStorage.getItem(PLAN_STORAGE_KEY)||'{}');return saved&&typeof saved==='object'&&!Array.isArray(saved)?saved:{}}
  catch(error){return {}}
}
function persistPersonalPlans(){try{localStorage.setItem(PLAN_STORAGE_KEY,JSON.stringify(personalPlans))}catch(error){showToast('本机存储失败，请检查浏览器设置')}}
function hasPlansForWeek(w){return Object.keys(personalPlans).some(key=>key.startsWith(w+'|'))}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function compact(value){const text=String(value||'');return text.length>4?text.slice(0,4)+'…':text}
function showToast(message){
  const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);
}
function applyTheme(theme){
  const next=theme==='dark'?'dark':'light';
  document.documentElement.dataset.theme=next;
  document.querySelector('meta[name="theme-color"]').setAttribute('content',next==='dark'?'#07111f':'#0284c7');
  document.getElementById('themeIcon').textContent=next==='dark'?'☀':'☾';
  document.getElementById('themeText').textContent=next==='dark'?'白天':'夜晚';
  document.getElementById('themeBtn').setAttribute('aria-pressed',next==='dark'?'true':'false');
  try{localStorage.setItem(THEME_STORAGE_KEY,next)}catch(error){}
}
function renderTabs(){
  const host=document.getElementById('weekTabs');host.innerHTML='';
  for(let w=1;w<=TOTAL_WEEKS;w++){
    const btn=document.createElement('button');btn.type='button';btn.className='week-tab';btn.dataset.week=w;
    btn.innerHTML='<strong>第'+w+'周</strong><small>'+shortDate(mondayOfWeek(w))+'</small>';
    btn.setAttribute('aria-label','查看第'+w+'周');
    btn.addEventListener('click',()=>{selectedWeek=w;renderAll();window.scrollTo({top:0,behavior:'smooth'})});
    host.appendChild(btn);
  }
}
function updateTabs(){
  document.querySelectorAll('.week-tab').forEach(btn=>{
    const w=Number(btn.dataset.week);btn.classList.toggle('active',w===selectedWeek);btn.classList.toggle('has-plan',hasPlansForWeek(w));
    if(w===selectedWeek)btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  });
}
function renderGrid(w){
  const grid=document.getElementById('weekGrid');
  const cells=['<div class="grid-head corner">时段</div>'];
  for(let day=1;day<=7;day++)cells.push('<div class="grid-head">'+DAY_NAMES[day]+'</div>');
  SLOTS.forEach(slot=>{
    cells.push('<div class="row-label"><span>'+slot.label+'</span><small>'+slot.periods+'</small></div>');
    for(let day=1;day<=7;day++){
      const courses=coursesAt(w,day,slot.key),plan=getPersonalPlan(w,day,slot.key),free=courses.length===0&&!plan;
      let mark='空闲',sub='＋添加',classes='slot free';
      if(courses.length&&plan){mark='课+';sub='含个人安排';classes='slot busy personal'}
      else if(courses.length){mark='有课';sub=compact(courses[0].name);classes='slot busy'}
      else if(plan){mark='安排';sub=compact(plan.title);classes='slot busy personal'}
      const aria=DAY_NAMES[day]+slot.label+'，'+(free?'空闲，点击添加安排':(courses.length?'有课程':'已有个人安排')+'，点击编辑');
      cells.push('<button class="'+classes+'" type="button" data-day="'+day+'" data-slot="'+slot.key+'" aria-label="'+escapeHtml(aria)+'"><span class="slot-mark">'+mark+'</span><span class="slot-sub">'+escapeHtml(sub)+'</span></button>');
    }
  });
  grid.innerHTML=cells.join('');
}
function renderSummary(w){
  const freeSlots=[],fullyFreeDays=[];
  for(let day=1;day<=7;day++){
    const freeForDay=SLOTS.filter(slot=>isSlotFree(w,day,slot.key));
    if(freeForDay.length===3)fullyFreeDays.push(DAY_NAMES[day]);
    freeForDay.forEach(slot=>freeSlots.push({day,slot}));
  }
  const freeByDay=[];
  for(let day=1;day<=7;day++){
    const labels=freeSlots.filter(item=>item.day===day).map(item=>item.slot.label);
    if(labels.length===3)freeByDay.push(DAY_NAMES[day]+'全天');else if(labels.length)freeByDay.push(DAY_NAMES[day]+labels.join('、'));
  }
  document.getElementById('freeCount').textContent=freeSlots.length+' / 21 个时段';
  document.getElementById('summaryTitle').textContent='第 '+w+' 周空档';
  document.getElementById('summaryNote').textContent=fullyFreeDays.length?'完全空闲日：'+fullyFreeDays.join('、'):'本周没有整天完全空闲';
  document.getElementById('freeList').innerHTML=freeByDay.length?freeByDay.map(item=>'<span class="free-chip">'+escapeHtml(item)+'</span>').join(''):'<span class="free-chip">本周所有时段都有安排</span>';
}
function renderDetails(w){
  const host=document.getElementById('detailList'),rows=[];let courseTotal=0,planTotal=0;
  for(let day=1;day<=7;day++){
    const items=[];
    SLOTS.forEach(slot=>{
      const courses=coursesAt(w,day,slot.key),plan=getPersonalPlan(w,day,slot.key);
      courses.forEach(c=>{
        courseTotal++;
        items.push('<div class="course-row"><div class="course-time">'+escapeHtml(c.periodText)+'</div><div><div class="course-name">'+escapeHtml(c.name)+'</div><div class="course-meta">老师：'+escapeHtml(c.teacher)+' · 地点：'+escapeHtml(c.room)+'</div></div></div>');
      });
      if(plan){
        planTotal++;
        const note=plan.note?'<div class="course-meta">'+escapeHtml(plan.note)+'</div>':'<div class="course-meta">个人添加的安排</div>';
        items.push('<div class="course-row personal-row"><div class="course-time">'+escapeHtml(slot.periods)+'</div><div><div class="course-name"><span class="tag personal">个人</span>'+escapeHtml(plan.title)+'</div>'+note+'</div></div>');
      }
    });
    if(items.length)rows.push('<section class="detail-day"><h3>'+DAY_NAMES[day]+'</h3>'+items.join('')+'</section>');
  }
  host.innerHTML=rows.length?rows.join(''):'<div class="no-class">本周没有课程或安排，整周都空闲。</div>';
  const parts=[];if(courseTotal)parts.push('课程 '+courseTotal+' 节段');if(planTotal)parts.push('个人安排 '+planTotal+' 项');
  document.getElementById('courseCount').textContent=parts.length?('本周共 '+parts.join('、')+'；下方按星期列出'):'本周无课程或安排';
}
function renderAll(){
  const mon=mondayOfWeek(selectedWeek),sun=sundayOfWeek(selectedWeek);
  document.getElementById('weekTitle').textContent='第 '+selectedWeek+' 周';
  document.getElementById('weekRange').textContent=fmt(mon)+' — '+fmt(sun);
  document.getElementById('prevWeek').disabled=selectedWeek===1;
  document.getElementById('nextWeek').disabled=selectedWeek===TOTAL_WEEKS;
  renderSummary(selectedWeek);renderGrid(selectedWeek);renderDetails(selectedWeek);updateTabs();
}
function setWeek(w){selectedWeek=Math.max(1,Math.min(TOTAL_WEEKS,w));renderAll()}
function findFirstFreeSlot(){
  for(let day=1;day<=7;day++)for(const slot of SLOTS)if(isSlotFree(selectedWeek,day,slot.key))return{day,slot:slot.key};
  return{day:1,slot:'morning'};
}
function syncEditor(){
  const day=Number(document.getElementById('planDay').value),slot=document.getElementById('planSlot').value,info=slotInfo(slot);
  const courses=coursesAt(selectedWeek,day,slot),plan=getPersonalPlan(selectedWeek,day,slot);
  editingKey=planKey(selectedWeek,day,slot);
  document.getElementById('slotPreview').textContent='第 '+selectedWeek+' 周 · '+DAY_NAMES[day]+' · '+info.label+'（'+info.periods+'）';
  const existing=document.getElementById('existingCourse');
  if(courses.length){
    existing.hidden=false;
    existing.innerHTML='<strong>该时段已有课程</strong>'+courses.map(c=>escapeHtml(c.name)+' · '+escapeHtml(c.teacher)+' · '+escapeHtml(c.room)).join('<br>');
  }else{existing.hidden=true;existing.innerHTML=''}
  document.getElementById('planTitle').value=plan?plan.title:'';
  document.getElementById('planNote').value=plan?(plan.note||''):'';
  document.getElementById('deletePlanBtn').hidden=!plan;
}
function openPlanEditor(day,slot){
  if(!slot){const fallback=findFirstFreeSlot();day=fallback.day;slot=fallback.slot}
  document.getElementById('planDay').value=String(day);document.getElementById('planSlot').value=slot;syncEditor();
  document.getElementById('planModal').hidden=false;document.body.classList.add('modal-open');
  setTimeout(()=>document.getElementById('planTitle').focus(),60);
}
function closePlanEditor(){
  document.getElementById('planModal').hidden=true;document.body.classList.remove('modal-open');editingKey=null;
}
document.getElementById('weekGrid').addEventListener('click',event=>{
  const cell=event.target.closest('.slot');if(cell)openPlanEditor(Number(cell.dataset.day),cell.dataset.slot);
});
document.getElementById('addPlanBtn').addEventListener('click',()=>openPlanEditor());
document.getElementById('planDay').addEventListener('change',syncEditor);
document.getElementById('planSlot').addEventListener('change',syncEditor);
document.getElementById('closePlanBtn').addEventListener('click',closePlanEditor);
document.getElementById('cancelPlanBtn').addEventListener('click',closePlanEditor);
document.getElementById('planModal').addEventListener('click',event=>{if(event.target.id==='planModal')closePlanEditor()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!document.getElementById('planModal').hidden)closePlanEditor()});
document.getElementById('planForm').addEventListener('submit',event=>{
  event.preventDefault();
  const title=document.getElementById('planTitle').value.trim();if(!title){document.getElementById('planTitle').focus();return}
  const day=Number(document.getElementById('planDay').value),slot=document.getElementById('planSlot').value,key=planKey(selectedWeek,day,slot);
  personalPlans[key]={title,note:document.getElementById('planNote').value.trim(),updatedAt:Date.now()};
  persistPersonalPlans();renderAll();closePlanEditor();showToast('安排已保存到本机');
});
document.getElementById('deletePlanBtn').addEventListener('click',()=>{
  if(!editingKey)return;delete personalPlans[editingKey];persistPersonalPlans();renderAll();closePlanEditor();showToast('安排已删除');
});
document.getElementById('themeBtn').addEventListener('click',()=>{
  applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
});
document.getElementById('prevWeek').addEventListener('click',()=>setWeek(selectedWeek-1));
document.getElementById('nextWeek').addEventListener('click',()=>setWeek(selectedWeek+1));
document.getElementById('todayBtn').addEventListener('click',()=>{setWeek(getCurrentWeek());showToast('已回到本周')});
document.getElementById('exportBtn').addEventListener('click',()=>{
  const data=JSON.stringify({version:1,exportedAt:new Date().toISOString(),plans:personalPlans},null,2);
  const url=URL.createObjectURL(new Blob([data],{type:'application/json'})),link=document.createElement('a');
  link.href=url;link.download='我的课表安排.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('备份文件已生成');
});
document.getElementById('importInput').addEventListener('change',event=>{
  const file=event.target.files&&event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result),imported=parsed&&parsed.plans&&typeof parsed.plans==='object'?parsed.plans:parsed;
      if(!imported||typeof imported!=='object'||Array.isArray(imported))throw new Error('invalid');
      personalPlans={...personalPlans,...imported};persistPersonalPlans();renderAll();showToast('安排已导入');
    }catch(error){showToast('文件格式不正确')}
  };
  reader.readAsText(file);event.target.value='';
});
const savedTheme=localStorage.getItem(THEME_STORAGE_KEY);
applyTheme(savedTheme||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
renderTabs();renderAll();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
